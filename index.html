<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F1EA" />
    <title>Bookworm — Your reading life, beautifully shelved</title>
    <meta name="description" content="Your reading life, beautifully shelved. Discover books, curate shelves, track reading goals, read PDFs with highlights and quotes, and connect with fellow readers." />
    <meta property="og:title" content="Bookworm — Your reading life, beautifully shelved" />
    <meta property="og:description" content="Your reading life, beautifully shelved. Discover books, curate shelves, track reading goals, read PDFs with highlights and quotes, and connect with fellow readers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const saved = localStorage.getItem('bookworm-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', saved ? saved === 'dark' : prefersDark);
      })();
    </script>
  </head>
  <body class="bg-ivory font-sans text-ink antialiased dark:bg-wineblack dark:text-[#F4E9E2]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
